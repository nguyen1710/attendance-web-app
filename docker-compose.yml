services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - api-gateway
    stdin_open: true
    networks:
      - app_network

  admin-service:
    build:
      context: ./backend/admin-service
    ports:
      - "3002"
    volumes:
      - ./backend/admin-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    networks:
      - app_network

  user-service:
    build:
      context: ./backend/user-service
    ports:
      - "3000"
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    networks:
      - app_network

  classroom-service:
    build:
      context: ./backend/classroom-service
    ports:
      - "3001"
    volumes:
      - ./backend/classroom-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    networks:
      - app_network

  attendance-service:
    build:
      context: ./backend/attendance-service
    ports:
      - "3003"
    volumes:
      - ./backend/attendance-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    networks:
      - app_network

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "4000:4000"
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    networks:
      - app_network

  nginx:
      image: nginx:latest
      ports:
        - "80:80"  # Chuyển hướng tất cả request vào Nginx
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mount file config vào Nginx
      depends_on:
        - user-service
        - admin-service
        - classroom-service
        - attendance-service
        - api-gateway
      networks:
        - app_network

networks:
  app_network:
    driver: bridge